[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-coach-logger"
version = "2.0.0"
description = "Local Windows telemetry logger for sim racing (iRacing, ACC)"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Lap Coach"}]
dependencies = [
    "PySide6>=6.7",
    "pyarrow>=15.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
iracing = ["pyirsdk>=1.3"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
lap-coach-logger = "lap_coach_logger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
