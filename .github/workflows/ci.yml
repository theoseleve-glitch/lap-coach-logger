name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy

      - name: Run ruff
        run: python -m ruff check src tests

      - name: Run mypy
        run: python -m mypy src

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/test_desktop_workspaces.py --ignore=tests/test_ghost_widget.py --ignore=tests/test_overlay_browser_frontend.py --ignore=tests/test_overlay_window_manager.py

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # T195: matrix across Windows 10-class (windows-2019) and
    # Windows 11-class (windows-2022) runners. Pinning explicit
    # version labels keeps coverage stable when GitHub flips
    # `windows-latest` forward to a future SKU.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean lap_coach_logger.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # T195: include matrix.os so each matrix job uploads
          # to a distinct artifact name (otherwise the second
          # upload fails on duplicate-name conflict).
          name: LapCoachLogger-${{ github.ref_name }}-${{ matrix.os }}
          path: dist/LapCoachLogger/
          retention-days: 30
